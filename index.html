<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>서울청년센터 광진 · 역량진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --coral: #E85D4C;
    --coral-dark: #C4432F;
    --navy: #2F3C7E;
    --navy-dark: #1F2A5C;
    --gold: #D9A441;
    --cream: #FDF6EE;
    --card: #FFFFFF;
    --text: #2B2B2B;
    --text-mute: #6B6B6B;
    --border: #EAE1D6;
    --green: #3E8E5A;
    --amber: #C9922E;
    --red: #C4432F;
    --bg: var(--cream);
    --heading: var(--navy);
    --role-selected-bg: #FCEFEC;
    --role-selected-text: #C4432F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1E2A;
      --card: #262B3D;
      --text: #ECEAF5;
      --text-mute: #A8ACC2;
      --border: #383F55;
      --cream: #232739;
      --heading: #AFC0F5;
      --role-selected-bg: #3A2B29;
      --role-selected-text: #F3A794;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1E2A;
    --card: #262B3D;
    --text: #ECEAF5;
    --text-mute: #A8ACC2;
    --border: #383F55;
    --cream: #232739;
    --heading: #AFC0F5;
    --role-selected-bg: #3A2B29;
    --role-selected-text: #F3A794;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; min-height: 100%; }
  .brand { font-size: 13px; color: var(--text-mute); letter-spacing: 0.02em; margin-bottom: 6px; }
  h1 { font-family: inherit; font-weight: 900; letter-spacing: -0.01em; font-size: 28px; margin: 0 0 10px; color: var(--heading); line-height: 1.3; }
  h2 { font-size: 19px; margin: 0 0 4px; color: var(--heading); }
  h3 { font-size: 15px; margin: 18px 0 8px; color: var(--text); }
  p { margin: 0 0 14px; color: var(--text); }
  .muted { color: var(--text-mute); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  .btn { display: inline-block; background: var(--coral); color: #fff; border: none; border-radius: 10px; padding: 13px 22px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:active { background: var(--coral-dark); }
  .btn.secondary { background: transparent; color: var(--heading); border: 1.5px solid var(--heading); }
  .btn.small { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
  .btn.ghost { background: transparent; color: var(--text-mute); border: none; text-decoration: underline; padding: 6px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; align-items: center; }
  input[type=text], select {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--border);
    font-size: 15px; font-family: inherit; background: var(--card); color: var(--text);
  }
  .fieldGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .fieldGrid { grid-template-columns: 1fr; } }
  .roleGrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 0 22px; }
  @media (max-width: 520px) { .roleGrid { grid-template-columns: 1fr; } }
  .accordionWrap { border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  .accordionToggle {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 13px 14px; background: var(--card); border: none; cursor: pointer;
    font-family: inherit; font-size: 15px; color: var(--text); font-weight: 700;
  }
  .accordionValue { font-weight: 400; color: var(--text-mute); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .accordionArrow { font-size: 11px; color: var(--coral); }
  .accordionPanel { border-top: 1.5px solid var(--border); }
  .accordionOption {
    padding: 13px 16px; cursor: pointer; font-size: 14.5px; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .accordionOption:last-child { border-bottom: none; }
  .accordionOption.selected { background: var(--role-selected-bg); color: var(--role-selected-text); font-weight: 700; }
  .quickNavTitle { text-align: center; font-size: 13px; font-weight: 700; color: var(--text-mute); margin: 26px 0 10px; letter-spacing: 0.02em; }
  .quickNav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quickNavBtn {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 18px 10px 14px; cursor: pointer; font-family: inherit;
    border-top: 4px solid var(--qc, var(--navy));
  }
  .quickNavBtn:active { background: var(--cream); }
  .quickNavIcon { font-size: 26px; line-height: 1; margin-bottom: 4px; }
  .quickNavLabel { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .quickNavSub { font-size: 11.5px; color: var(--qc, var(--text-mute)); font-weight: 700; }
  .roleCard {
    border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 10px; text-align: center;
    cursor: pointer; background: var(--card); font-weight: 700; color: var(--text); font-size: 15px;
  }
  .roleCard.selected { border-color: var(--coral); background: var(--role-selected-bg); color: var(--role-selected-text); }
  .progressWrap { background: var(--border); border-radius: 8px; height: 8px; overflow: hidden; margin: 4px 0 22px; }
  .progressBar { background: var(--coral); height: 100%; border-radius: 8px; transition: width .25s ease; }
  .stepLabel { font-size: 13px; color: var(--text-mute); margin-bottom: 4px; }
  .item { padding: 18px 0; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .itemSub { font-size: 12.5px; color: var(--coral-dark); font-weight: 700; margin-bottom: 4px; letter-spacing: 0.01em; }
  .itemText { font-size: 15.5px; margin-bottom: 14px; color: var(--text); }
  .scaleGroup { margin-bottom: 10px; }
  .scaleLabel { font-size: 12px; font-weight: 700; color: var(--text-mute); margin-bottom: 6px; }
  .scale { display: flex; gap: 6px; }
  .scaleBtn {
    flex: 1; padding: 9px 3px; text-align: center; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 11px; color: var(--text-mute); font-family: inherit; line-height: 1.25;
    white-space: nowrap;
  }
  .scaleBtn .num { display: block; font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 1px; }
  .scaleBtn.selected.level { border-color: var(--navy); background: var(--navy); }
  .scaleBtn.selected.importance { border-color: var(--gold); background: var(--gold); }
  .scaleBtn.selected, .scaleBtn.selected .num { color: #fff; }
  @media (max-width: 520px) {
    .scale { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .scaleBtn {
      display: flex; align-items: center; justify-content: flex-start; gap: 7px;
      padding: 11px 12px; font-size: 13px; white-space: nowrap;
    }
    .scaleBtn .num {
      display: inline-flex; align-items: center; justify-content: center; flex: none;
      width: 22px; height: 22px; border-radius: 999px; background: var(--border);
      font-size: 12.5px; margin-bottom: 0; color: var(--text);
    }
    .scaleBtn.selected .num { background: rgba(255,255,255,0.28); color: #fff; }
    .scale .scaleBtn:last-child { grid-column: 1 / -1; justify-content: center; }
  }
  .navRow { display: flex; justify-content: space-between; margin-top: 22px; align-items: center; }
  .factorBar { margin-bottom: 16px; }
  .factorBarTop { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .factorBarName { font-weight: 700; }
  .factorTrack { background: var(--border); border-radius: 6px; height: 12px; overflow: hidden; position: relative; }
  .factorFill { height: 100%; border-radius: 6px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-left: 6px; }
  .tag.dev { background: #FCE4E4; color: var(--red); }
  .tag.ok { background: #E2EFDA; color: var(--green); }
  .tag.mid { background: #FFF2CC; color: var(--amber); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-mute); font-weight: 700; font-size: 12.5px; }
  .footer { text-align: center; margin-top: 30px; }
  .banner { background: #FFF2CC; color: #6B5518; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
  .center { text-align: center; }
  .bigNum { font-family: inherit; font-size: 42px; font-weight: 900; color: var(--heading); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; }
  .legendItem { display: flex; align-items: center; gap: 6px; }
  .legendSwatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chartWrap { overflow-x: auto; }
  .navTabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .navTab { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--card); font-size: 13px; font-weight: 700; color: var(--text-mute); cursor: pointer; }
  .navTab.active { background: var(--navy); border-color: var(--navy); color: #fff; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ================= 데이터: 서울청년센터 광진 자체 역량모델 =================
const COMMON = [
  { key:'A', title:'청년중심성', items:[
    ['청년이해','나는 청년의 문제를 개인의 능력이나 태도만으로 판단하지 않고 그가 처한 사회·경제적 환경을 함께 고려한다.'],
    ['청년감수성','나는 청년이 직접 표현하지 않은 불편이나 어려움도 세심하게 살피려고 한다.'],
    ['다양성·개별성 존중','나는 같은 문제를 가진 청년이라도 상황과 필요한 지원이 서로 다를 수 있음을 고려한다.'],
    ['자기결정 존중','나는 청년에게 내가 생각하는 최선의 방법을 강요하기보다 스스로 선택할 수 있도록 필요한 정보를 제공한다.'],
    ['수요자 관점','나는 센터의 서비스나 프로그램을 청년의 입장에서 생각해 보고 불편한 점이나 개선할 점을 찾으려고 한다.'],
  ]},
  { key:'B', title:'소통·관계형성', items:[
    ['경청·공감','나는 청년이나 동료의 말을 충분히 들은 후 나의 의견이나 판단을 제시한다.'],
    ['명확한 의사표현','나는 복잡한 정책이나 업무 내용을 언어·비언어적 표현으로 효과적으로 전달한다.'],
    ['관계형성·신뢰구축','나는 청년·동료·협력기관과의 약속과 업무상 합의를 일관되게 지킨다.'],
    ['갈등관리','나는 의견이 다른 상황에서도 개인적인 감정과 업무상 쟁점을 구분하여 해결방안을 찾는다.'],
    ['협업·팀워크','나는 공동의 목표를 달성하기 위해 나의 역할에 책임을 다하고 필요한 경우 동료의 업무를 지원하거나 역할을 조정한다.'],
  ]},
  { key:'C', title:'문제해결·판단', items:[
    ['문제인식·분석','나는 문제가 발생했을 때 현상과 실제 원인을 구분하여 파악하려고 한다.'],
    ['우선순위 판단','나는 문제가 발생하면 중요도와 긴급성, 청년과 조직에 미치는 영향을 고려하여 처리 순서를 결정한다.'],
    ['대안탐색','나는 문제를 해결할 때 기존 방식 외에도 다른 해결방법을 찾아본다.'],
    ['의사결정','나는 여러 대안을 비교한 후 실행 가능성과 예상되는 결과를 고려하여 결정한다.'],
    ['실행·개선','나는 문제를 적합한 해결 방법으로 해결한 후 그 결과를 확인하고 동일한 문제가 반복되지 않도록 개선한다.'],
  ]},
  { key:'D', title:'공공성·책무성', items:[
    ['책임감','나는 맡은 업무를 정해진 기한 내에 완료하고 필요한 후속조치까지 확인한다.'],
    ['공공성·윤리의식','나는 개인적인 편의나 관계보다 청년과 기관의 공적 목적을 우선하여 업무를 판단한다.'],
    ['규정·절차 준수','나는 중요한 업무를 처리하기 전에 관련 법령·지침·기관규정을 확인한다.'],
    ['공정성·투명성','나는 사업과 서비스 제공 과정에서 동일한 기준을 일관되게 적용하려고 한다.'],
    ['개인정보·이용자 보호','나는 상담이나 사업 과정에서 알게 된 청년의 개인정보와 민감한 정보를 철저히 보호한다.'],
  ]},
  { key:'E', title:'학습·혁신·변화대응', items:[
    ['자기인식·자기성찰','나는 나의 강점과 한계를 파악하고 업무 결과와 피드백을 바탕으로 개선할 점을 구체적으로 파악한다.'],
    ['지속적 학습','나는 업무에 필요한 새로운 정책·정보·지식을 스스로 찾아 학습한다.'],
    ['변화적응','나는 청년정책이나 조직의 변화가 있을 때 변화의 이유를 이해하고 업무방식을 조정한다.'],
    ['업무혁신','나는 업무에 더 나은 방법을 찾아 개선한다.'],
    ['디지털·AI 활용','나는 디지털 도구나 AI를 업무 목적에 맞게 활용하여 업무의 효율성과 결과의 질을 높인다.'],
  ]},
];

const JOB = [
  { key:'F', title:'청년·정책·지역 분석', items:[
    ['청년·지역 특성 분석','나는 담당업무와 관련된 지역 청년의 특성과 주요 이슈를 파악하여 업무에 활용한다.'],
    ['정책·제도 이해','나는 중앙정부·서울시·광진구의 청년정책과 제도의 변경사항을 확인하여 업무에 반영한다.'],
    ['지역자원 탐색','나는 청년에게 필요한 지역기관과 지원자원의 내용·이용조건을 파악하여 적절한 자원을 찾아낼 수 있다.'],
    ['정보·욕구·트렌드 분석','나는 상담·설문·프로그램 참여자료 등 다양한 자료를 활용하여 청년의 욕구와 변화를 파악하고 업무에 반영한다.'],
  ]},
  { key:'G', title:'청년지원·상담·서비스 설계', items:[
    ['상담·욕구사정','나는 청년의 표면적인 요구뿐 아니라 그 요구가 발생한 배경과 상황을 함께 파악한다.'],
    ['정책·서비스 탐색','나는 청년의 상황에 적합한 정책·서비스를 탐색하고 대상조건과 지원내용을 확인하여 정확하게 안내한다.'],
    ['자원연계','나는 청년의 복합적인 욕구에 대응하기 위해 여러 정책이나 지역자원을 연계하는 방안을 검토한다.'],
    ['서비스 설계','나는 청년에게 맞는 서비스를 설계하고 운영한다.'],
    ['사례·사후관리','나는 서비스를 지원하고 청년의 변화와 추가적인 욕구를 확인하고 필요한 경우 지원방법을 조정한다.'],
  ]},
  { key:'H', title:'사업기획·운영·성과관리', items:[
    ['사업기획·목표설정','나는 사업을 기획할 때 해결하고자 하는 청년문제와 사업의 필요성을 구체적으로 정의한다.'],
    ['사업설계','나는 사업목표·대상·프로그램·예산·일정이 서로 논리적으로 연결되도록 사업을 설계한다.'],
    ['실행·자원·위험관리','나는 사업을 운영하면서 발생할 수 있는 문제와 위험요인을 사전에 파악하고 대응방안을 준비한다.'],
    ['성과평가','나는 기획에 따른 성과 달성을 분석하고 평가한다.'],
    ['환류·사업고도화','나는 사업평가 결과를 분석하여 다음 사업의 내용이나 운영방식을 실제로 개선한다.'],
  ]},

function groupedFactorBarsHTML(groups) {
  return LAYER_ORDER.map(layerKey => {
    const items = groups.filter(g => g.layer && g.layer.indexOf(layerKey) === 0);
    if (items.length === 0) return '';
    const layerAvg = avg(items.map(g => g.level));
    const color = LAYER_COLOR[layerKey];
    return `
      <div style="margin-bottom:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:9px 14px; background:${color}; border-radius:10px 10px 0 0;">
          <span style="color:#fff; font-weight:700; font-size:14.5px;">${escapeHtml(items[0].layer)}</span>
          <span style="color:#fff; font-size:13px;">층 평균 ${fmt(layerAvg)}</span>
        </div>
        <div style="border:1.5px solid ${color}; border-top:none; border-radius:0 0 10px 10px; padding:14px 16px 2px;">
          ${items.map(g => `
            <div class="factorBar">
              <div class="factorBarTop">
                <span class="factorBarName">${escapeHtml(g.title)}</span>
                <span>수준 ${fmt(g.level)} · 중요도 ${fmt(g.importance)} ${levelTag(g.level)}</span>
              </div>
              <div class="factorTrack"><div class="factorFill" style="width:${(g.level/5*100).toFixed(0)}%; background:${barColor(g.level)};"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

  adminExtraTeams: [], // 관리자가 응답 없이 미리 추가한 팀 이름
};

function buildSections(role) {
  const s = [];
  COMMON.forEach(g => s.push({ layer:'공통역량', ...g }));
  JOB.forEach(g => s.push({ layer:'직무역량', ...g }));
  (ROLE[role] || []).forEach(g => s.push({ layer:'역할역량 · ' + role, ...g }));
  return s;
}
function itemId(sec, idx) { return sec.key + '-' + idx; }
function allAnsweredInSection(sec) {
  return sec.items.every((_, i) => {
    const a = state.answers[itemId(sec, i)];
    return a && a.level != null && a.importance != null;
  });
}

function computeScores() {
  const groupScores = {};
  state.sections.forEach(sec => {
    const levels = [], importances = [];
    sec.items.forEach((_, i) => {
      const a = state.answers[itemId(sec, i)];
      if (a) { if (a.level != null) levels.push(a.level); if (a.importance != null) importances.push(a.importance); }
    });
    groupScores[sec.key] = {
      title: sec.title, layer: sec.layer,
      level: avg(levels), importance: avg(importances),
    };
  });
  const byLayer = (layerPrefix) => {
    const keys = state.sections.filter(s => s.layer.startsWith(layerPrefix)).map(s => s.key);
    const lv = keys.map(k => groupScores[k].level).filter(v => v != null);
    const im = keys.map(k => groupScores[k].importance).filter(v => v != null);
    return { level: avg(lv), importance: avg(im) };
  };
  return { groupScores, common: byLayer('공통역량'), job: byLayer('직무역량'), role: byLayer('역할역량') };
}

    common_avg: payload.commonAvg, job_avg: payload.jobAvg, role_avg: payload.roleAvg,
  });
  const fromRow = (row) => ({
    name: row.name, role: row.role, team: row.team, year: row.year, round: row.round,
    submittedAt: row.submitted_at, answers: row.answers, groupScores: row.group_scores,
    commonAvg: row.common_avg, jobAvg: row.job_avg, roleAvg: row.role_avg,
  });

  return {
    collection(name) {
      return {
        async add(payload) {
          const { error } = await client.from(name).insert([toRow(payload)]);
          if (error) throw error;
          return {};
        },
        async get() {
          const { data, error } = await client.from(name).select('*');
          if (error) throw error;
          return { docs: (data || []).map(row => ({ data: () => fromRow(row) })) };
        },
      };
    },
    doc(path) {
      // 형식: "settings/teamPasscodes" 같은 "테이블/키" 문자열
      const [table, key] = path.split('/');
      return {
        async get() {
          const { data, error } = await client.from(table).select('*').eq('key', key).maybeSingle();
          if (error) throw error;
          return { exists: !!data, data: () => (data ? data.value : undefined) };
        },
        async set(obj) {
          const { error } = await client.from(table).upsert({ key, value: obj, updated_at: new Date().toISOString() });
          if (error) throw error;
        },
      };
    },
  };
}

async function initDb() {
  try {
    const adapter = buildSupabaseAdapter();
    if (adapter) { state.dbNS = adapter; state.dbReady = true; return; }
  } catch (e) {}
  // Supabase 설정이 안 되어 있으면, 혹시 Claude 아티팩트 환경에서 열린 경우를 위해 기존 방식도 시도
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db');
    if (db) { state.dbNS = db; state.dbReady = true; }
  } catch (e) {}
}

let _downloadsNS;
async function getDownloads() {
  if (_downloadsNS !== undefined) return _downloadsNS;
  // 일반 웹페이지(Vercel 등)에서는 브라우저 자체 다운로드 방식을 사용
  _downloadsNS = {
    async save({ filename, data }) {
      const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },
  };
  // Claude 아티팩트 환경에서 열린 경우에는 그쪽 기능을 우선 사용
  try {
    if (window.claude && window.claude.use) {
      const claudeDownloads = await window.claude.use('downloads');
      if (claudeDownloads) _downloadsNS = claudeDownloads;
    }
  } catch (e) {}
  return _downloadsNS;
}
async function saveResponse() {
  const scores = computeScores();
  const payload = {
    name: state.name, role: state.role, year: state.year, round: state.round,
    team: (state.role === '매니저' || state.role === '선임매니저') ? (state.team || '') : '',
    submittedAt: new Date().toISOString(),
    answers: state.answers,
    groupScores: Object.fromEntries(Object.entries(scores.groupScores).map(([k,v])=>[k,{level:v.level, importance:v.importance}])),
    commonAvg: scores.common, jobAvg: scores.job, roleAvg: scores.role,
  };
  if (state.dbReady && state.dbNS) {
    try { await state.dbNS.collection('responses').add(payload); state.saved = true; state.saveMode = 'shared'; state.cache = null; return; }
    catch (e) {}
  }
  try {
    const local = JSON.parse(localStorage.getItem('gj_competency_local') || '[]');
    local.push(payload);
    localStorage.setItem('gj_competency_local', JSON.stringify(local));
    state.saved = true; state.saveMode = 'local'; state.cache = null;
  } catch (e) {}
}
async function fetchAllResponses(force) {
  if (state.cache && !force) return state.cache;
  const rows = [];
  if (state.dbReady && state.dbNS) {
    try { const snap = await state.dbNS.collection('responses').get(); snap.docs.forEach(d => rows.push(d.data())); }
    catch (e) {}
  }
  if (rows.length === 0) {
    try { const local = JSON.parse(localStorage.getItem('gj_competency_local') || '[]'); rows.push(...local); } catch (e) {}
  }
  state.cache = rows;
  return rows;
}

// ================= 유틸 =================
function fmt(n) { return (n == null || isNaN(n)) ? '-' : n.toFixed(1); }
function avg(arr) { const a = arr.filter(v => v != null); return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function roundLabel(r) { return r.year + '-' + r.round + '회차'; }
function sortRounds(rows) { return rows.slice().sort((a,b)=> a.year - b.year || a.round - b.round); }
function levelTag(v) {
  if (v == null) return '';
  if (v >= 4) return '<span class="tag ok">양호</span>';
  if (v >= REQUIRED_LEVEL) return '<span class="tag mid">보통</span>';
  return '<span class="tag dev">개발필요</span>';
}
function barColor(v) {
  if (v == null) return '#ccc';
  if (v >= 4) return 'var(--green)';
  if (v >= REQUIRED_LEVEL) return 'var(--amber)';
  return 'var(--red)';
}
function overallLevel(row) {
  const vals = [row.commonAvg && row.commonAvg.level, row.jobAvg && row.jobAvg.level, row.roleAvg && row.roleAvg.level].filter(v=>v!=null);
  return avg(vals);
}

// ================= SVG 차트 =================
function lineChartSVG(series, xLabels, opts) {
  opts = opts || {};
  const width = opts.width || 640, height = opts.height || 260;
  const pad = { l: 34, r: 16, t: 16, b: 40 };
  const innerW = width - pad.l - pad.r, innerH = height - pad.t - pad.b;
  const yMin = 1, yMax = 5;
  const n = xLabels.length;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const xAt = i => pad.l + xStep * i;
  const yAt = v => pad.t + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

  let grid = '';
  for (let v = 1; v <= 5; v++) {
    const y = yAt(v);
    grid += `<line x1="${pad.l}" y1="${y}" x2="${width-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1" />`;
    grid += `<text x="${pad.l-8}" y="${y+4}" font-size="10.5" fill="var(--text-mute)" text-anchor="end">${v}</text>`;
  }
  let xAxisLabels = '';
  xLabels.forEach((lb, i) => {
    xAxisLabels += `<text x="${xAt(i)}" y="${height-pad.b+18}" font-size="10.5" fill="var(--text-mute)" text-anchor="middle">${escapeHtml(lb)}</text>`;
  });

  let paths = '';
  series.forEach(s => {
    let d = ''; let open = false;
    s.values.forEach((v, i) => {
      if (v == null) { open = false; return; }
      const x = xAt(i), y = yAt(v);
      d += (open ? ' L ' : ' M ') + x.toFixed(1) + ',' + y.toFixed(1);
      open = true;
    });
    paths += `<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.5}" stroke-dasharray="${s.dashed?'5,4':'none'}" />`;
    s.values.forEach((v, i) => {
      if (v == null) return;
      paths += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="${s.width && s.width>3?4.5:3.5}" fill="${s.color}" />`;
    });
  });

  // 값 라벨 — 같은 x열에서 점들이 가까우면 겹치지 않도록 세로로 밀어냄
  let valueLabels = '';
  if (opts.showLabels) {
    xLabels.forEach((_, xi) => {
      let pts = series
        .map(s => ({ v: s.values[xi], color: s.color }))
        .filter(p => p.v != null)
        .map(p => ({ ...p, y: yAt(p.v) }))
        .sort((a, b) => a.y - b.y);
      const minGap = 12;
      for (let k = 1; k < pts.length; k++) {
        if (pts[k].y - pts[k - 1].y < minGap) pts[k].y = pts[k - 1].y + minGap;
      }
      pts.forEach(p => {
        const x = xAt(xi);
        const onRightEdge = xi === xLabels.length - 1;
        const lx = onRightEdge ? x - 8 : x + 8;
        valueLabels += `<text x="${lx}" y="${(p.y + 3).toFixed(1)}" font-size="9.5" font-weight="700" fill="${p.color}" text-anchor="${onRightEdge ? 'end' : 'start'}">${fmt(p.v)}</text>`;
      });
    });
  }

  const legend = `<div class="legend">${series.map(s => `<div class="legendItem"><span class="legendSwatch" style="background:${s.color}"></span>${escapeHtml(s.name)}</div>`).join('')}</div>`;

  return `<div class="chartWrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${grid}${paths}${valueLabels}${xAxisLabels}</svg></div>${legend}`;
}

function wrapAxisLabel(text) {
  const maxLen = 7;
  if (text.length <= maxLen) return [text];
  const breakChars = [' ', '·'];
  let bestIdx = -1;
  for (let i = Math.floor(text.length / 2); i >= 1; i--) { if (breakChars.includes(text[i])) { bestIdx = i; break; } }
  if (bestIdx === -1) { for (let i = Math.floor(text.length / 2); i < text.length; i++) { if (breakChars.includes(text[i])) { bestIdx = i; break; } } }
  if (bestIdx === -1) return [text];
  return [text.slice(0, bestIdx).trim(), text.slice(bestIdx + 1).trim()].filter(Boolean);
}

function radarChartSVG(axesLabels, series, opts) {
  opts = opts || {};
  const size = opts.size || 340;
  const cx = size / 2, cy = size / 2 - 6;
  const radius = size / 2 - (opts.labelMargin || 54);
  const n = axesLabels.length;
  const angle = i => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const ptAt = (i, v) => {
    const r = (v / 5) * radius;
    return [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  };

  let rings = '';
  [1,2,3,4,5].forEach(v => {
    const pts = axesLabels.map((_, i) => ptAt(i, v).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1" />`;
  });
  let axesLines = '', axesLabelsSvg = '';
  axesLabels.forEach((label, i) => {
    const [x, y] = ptAt(i, 5);
    axesLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="1" />`;
    const lx = cx + (radius + 24) * Math.cos(angle(i));
    const ly = cy + (radius + 24) * Math.sin(angle(i));
    const lines = wrapAxisLabel(label);
    const lineHeight = 12;
    const totalH = (lines.length - 1) * lineHeight;
    lines.forEach((line, li) => {
      const ty = ly - totalH / 2 + li * lineHeight;
      axesLabelsSvg += `<text x="${lx}" y="${ty}" font-size="10.5" fill="var(--text-mute)" text-anchor="middle">${escapeHtml(line)}</text>`;
    });
  });

  let polys = '';
  series.forEach(s => {
    const pts = axesLabels.map((_, i) => ptAt(i, s.values[i] == null ? 0 : s.values[i]).join(',')).join(' ');
    polys += `<polygon points="${pts}" fill="${s.color}" fill-opacity="0.18" stroke="${s.color}" stroke-width="2.5" />`;
    axesLabels.forEach((_, i) => {
      if (s.values[i] == null) return;
      const [x,y] = ptAt(i, s.values[i]);
      polys += `<circle cx="${x}" cy="${y}" r="3" fill="${s.color}" />`;
    });
  });

  // 값 라벨 — 같은 축에서 두 계열 값이 가까우면 반지름 방향으로 밀어내 겹치지 않게 함
  let valueLabelsSvg = '';
  const minRadialGap = 15;
  axesLabels.forEach((_, i) => {
    let items = series
      .map(s => ({ v: s.values[i], color: s.color }))
      .filter(it => it.v != null)
      .map(it => ({ ...it, r: (it.v / 5) * radius }))
      .sort((a, b) => a.r - b.r);
    for (let k = 1; k < items.length; k++) {
      if (items[k].r - items[k - 1].r < minRadialGap) items[k].r = items[k - 1].r + minRadialGap;
    }
    items.forEach(it => {
      const lx = cx + (it.r + 11) * Math.cos(angle(i));
      const ly = cy + (it.r + 11) * Math.sin(angle(i));
      valueLabelsSvg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" font-weight="700" fill="${it.color}" text-anchor="middle">${fmt(it.v)}</text>`;
    });
  });

  const legend = `<div class="legend">${series.map(s => `<div class="legendItem"><span class="legendSwatch" style="background:${s.color}"></span>${escapeHtml(s.name)}</div>`).join('')}</div>`;
  return `<div class="chartWrap center"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${axesLines}${polys}${valueLabelsSvg}${axesLabelsSvg}</svg></div>${legend}`;
}

function groupedBarSVG(categories, seriesNames, seriesColors, dataByCategory, opts) {
  // dataByCategory: [[v1,v2,...], ...] aligned to categories, values aligned to seriesNames
  opts = opts || {};
  const barW = opts.barWidth || 22;
  const groupGap = opts.groupGap || 22;
  const groupW = Math.max(barW * seriesNames.length + 10, barW * seriesNames.length) + groupGap;
  const pad = { l: 34, r: 16, t: 20, b: opts.bottomPad || 40 };
  const width = opts.width || (pad.l + pad.r + groupW * categories.length);
  const height = opts.height || 260;
  const innerH = height - pad.t - pad.b;
  const yAt = v => pad.t + innerH - (v/5) * innerH;

  let grid = '';
  for (let v=1; v<=5; v++) {
    const y = yAt(v);
    grid += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + groupW*categories.length}" y2="${y}" stroke="var(--border)" stroke-width="1" />`;
    grid += `<text x="${pad.l-8}" y="${y+4}" font-size="10.5" fill="var(--text-mute)" text-anchor="end">${v}</text>`;
  }
  let bars = '', labels = '', valueLabels = '';
  categories.forEach((cat, ci) => {
    const groupX = pad.l + groupW * ci + (groupW - groupGap - barW*seriesNames.length)/2;
    seriesNames.forEach((sn, si) => {
      const v = dataByCategory[ci][si];
      if (v == null) return;
      const x = groupX + si*barW;
      const y = yAt(v);
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW-3).toFixed(1)}" height="${(pad.t+innerH-y).toFixed(1)}" fill="${seriesColors[si]}" rx="3" />`;
      valueLabels += `<text x="${(x+(barW-3)/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9" font-weight="700" fill="${seriesColors[si]}" text-anchor="middle">${fmt(v)}</text>`;
    });
    const lines = wrapAxisLabel(cat);
    const lx = pad.l + groupW*ci + (groupW-groupGap)/2;
    lines.forEach((line, li) => {
      labels += `<text x="${lx.toFixed(1)}" y="${(height-pad.b+16+li*11).toFixed(1)}" font-size="9.5" fill="var(--text-mute)" text-anchor="middle">${escapeHtml(line)}</text>`;
    });
  });
  const legend = `<div class="legend">${seriesNames.map((n,i)=>`<div class="legendItem"><span class="legendSwatch" style="background:${seriesColors[i]}"></span>${escapeHtml(n)}</div>`).join('')}</div>`;
  return `<div class="chartWrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${grid}${bars}${valueLabels}${labels}</svg></div>${opts.hideLegend ? '' : legend}`;
}

// ================= Borich 요구도 & Locus for Focus =================
// WDS(가중 불일치 점수) = (중요도평균 - 현재수준평균) × 중요도평균  (Borich, 1980)
function borichScores(groupKeys, rows) {
  return groupKeys.map(k => {
    const levels = rows.map(r => r.groupScores && r.groupScores[k] && r.groupScores[k].level).filter(v=>v!=null);
    const imps = rows.map(r => r.groupScores && r.groupScores[k] && r.groupScores[k].importance).filter(v=>v!=null);
    const L = avg(levels), I = avg(imps);
    const gap = (L!=null && I!=null) ? (I - L) : null;
    const wds = (gap!=null && I!=null) ? gap * I : null;
    return { key:k, title: GROUP_TITLE[k] || k, level:L, importance:I, gap, wds, n: levels.length };
  }).filter(g => g.wds != null).sort((a,b)=> b.wds - a.wds);
}

function borichTableHTML(scoresArr) {
  if (scoresArr.length === 0) return '<p class="muted">계산할 데이터가 없습니다.</p>';
  return `
    <table>
      <thead><tr><th>순위</th><th>역량</th><th>현재수준</th><th>중요도</th><th>격차</th><th>WDS</th></tr></thead>
      <tbody>
        ${scoresArr.map((g,i) => `
          <tr>
            <td>${i+1}</td>
            <td>${escapeHtml(g.title)}</td>
            <td>${fmt(g.level)}</td>
            <td>${fmt(g.importance)}</td>
            <td>${g.gap>=0?'+':''}${fmt(g.gap)}</td>
            <td><b>${fmt(g.wds)}</b></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// Locus for Focus 사분면 산점도: X=격차(중요도-현재수준), Y=중요도
function locusScatterSVG(points, opts) {
  opts = opts || {};
  const width = opts.width || 460, height = opts.height || 400;
  const pad = { l: 42, r: 20, t: 20, b: 40 };
  const innerW = width - pad.l - pad.r, innerH = height - pad.t - pad.b;
  const gaps = points.map(p=>p.gap);
  let xMin = Math.min(-0.5, ...gaps) - 0.3, xMax = Math.max(0.5, ...gaps) + 0.3;
  const yMin = 1, yMax = 5;
  const xAt = v => pad.l + ((v - xMin) / (xMax - xMin)) * innerW;
  const yAt = v => pad.t + innerH - ((v - yMin) / (yMax - yMin)) * innerH;
  const meanGap = avg(points.map(p=>p.gap));
  const meanImp = avg(points.map(p=>p.importance));

  let grid = '';
  grid += `<rect x="${pad.l}" y="${pad.t}" width="${innerW}" height="${innerH}" fill="none" stroke="var(--border)" stroke-width="1" />`;
  [1,2,3,4,5].forEach(v => {
    grid += `<text x="${pad.l-8}" y="${yAt(v)+4}" font-size="10" fill="var(--text-mute)" text-anchor="end">${v}</text>`;
    grid += `<line x1="${pad.l}" y1="${yAt(v)}" x2="${width-pad.r}" y2="${yAt(v)}" stroke="var(--border)" stroke-width="0.5" />`;
  });
  const xTickStep = ((xMax - xMin) > 4) ? 1 : 0.5;
  for (let v = Math.ceil(xMin/xTickStep)*xTickStep; v <= xMax; v += xTickStep) {
    grid += `<text x="${xAt(v)}" y="${height-pad.b+16}" font-size="10" fill="var(--text-mute)" text-anchor="middle">${v.toFixed(1)}</text>`;
  }
  // 사분면 기준선 (평균)
  grid += `<line x1="${xAt(meanGap)}" y1="${pad.t}" x2="${xAt(meanGap)}" y2="${height-pad.b}" stroke="var(--coral)" stroke-width="1.5" stroke-dasharray="4,4" />`;
  grid += `<line x1="${pad.l}" y1="${yAt(meanImp)}" x2="${width-pad.r}" y2="${yAt(meanImp)}" stroke="var(--coral)" stroke-width="1.5" stroke-dasharray="4,4" />`;
  grid += `<text x="${width-pad.r-4}" y="${pad.t+14}" font-size="10.5" fill="var(--coral-dark)" text-anchor="end" font-weight="700">우선순위 영역</text>`;
  grid += `<text x="${(pad.l+innerW/2).toFixed(1)}" y="${height-6}" font-size="11" fill="var(--text-mute)" text-anchor="middle">격차(중요도−현재수준) →</text>`;

  let points_svg = '';
  points.forEach(p => {
    const priority = p.gap >= meanGap && p.importance >= meanImp;
    const x = xAt(p.gap), y = yAt(p.importance);
    points_svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${priority?'var(--coral)':'var(--navy)'}" fill-opacity="0.85" />`;
    points_svg += `<text x="${x.toFixed(1)}" y="${(y-10).toFixed(1)}" font-size="10.5" fill="${priority?'var(--coral-dark)':'var(--text-mute)'}" text-anchor="middle" font-weight="${priority?'700':'400'}">${escapeHtml(p.key)}</text>`;
  });

  return `<div class="chartWrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${grid}${points_svg}</svg></div>
    <p class="muted" style="margin-top:8px;">점선 교차점은 전체 평균(격차 ${fmt(meanGap)}, 중요도 ${fmt(meanImp)})입니다. 오른쪽 위(코랄색 점)가 중요도·격차 모두 평균 이상인 <b>최우선 개발 영역</b>입니다.</p>`;
}

function borichCardHTML(id, title, scoresArr) {
  const top3 = scoresArr.slice(0, 3);
  return `
    <div class="card">
      <h2>${escapeHtml(title)}</h2>
      <p class="muted" style="margin-bottom:14px;">Borich 요구도 공식(WDS = 격차 × 중요도)으로 산출한 교육 우선순위입니다.</p>

    <p class="muted">담당: ${escapeHtml(state.name)} 선임매니저 · 팀원: ${managers.map(escapeHtml).join(', ')}</p>

    <div class="card">
      <h2>연도·회차별 종합 역량 추이</h2>
      <p class="muted" style="margin-bottom:14px;">매니저별 선과 팀 평균(검은 점선)을 함께 표시했습니다.</p>

      <div class="fieldGrid" style="margin-bottom:16px;">
        <div>

        <div>
          <div class="scaleLabel">회차 선택</div>
          <select id="roundSelect2">${rounds.map(rk=>`<option value="${rk}" ${rk===latestRoundKey?'selected':''}>${rk.replace('-',' - ')}회차</option>`).join('')}</select>

      <h3 style="margin-top:6px;">공통역량</h3>

      <div id="radarHolderRole"></div>

    ${borichCardHTML('locusTeam', '우리 팀 교육 우선순위 (Borich 요구도 분석 · ' + latestRoundKey.replace('-',' - ') + '회차)',
      borichScores(MANAGER_TIER_KEYS, team.filter(r => (r.year+'-'+r.round) === latestRoundKey)))}

    <div class="footer"><button class="btn secondary" id="backBtn">돌아가기</button></div>
  `;

    MANAGER_TIER_KEYS.forEach(k => {
      const vals = roundRows.map(r => r.groupScores && r.groupScores[k] && r.groupScores[k].level).filter(v=>v!=null);

    });
    const layerCharts = [
      { holder: 'radarHolderCommon', keys: COMMON.map(g=>g.key) },
      { holder: 'radarHolderJob', keys: JOB.map(g=>g.key) },
      { holder: 'radarHolderRole', keys: ROLE['매니저'].map(g=>g.key) },

      document.getElementById(holder).innerHTML = radar;

  document.getElementById('mgrSelect').onchange = drawRadar;
  document.getElementById('roundSelect2').onchange = drawRadar;

}

  ));
  const mgrRoleTrend = roleAvgByRole('매니저');
  const seniorRoleTrend = roleAvgByRole('선임매니저');
  const centerRoleTrend = roleAvgByRole('센터장');

    { name:'전체 공통역량 평균', color: CHART_COLORS[0], values: orgCommon },
    { name:'전체 직무역량 평균', color: CHART_COLORS[1], values: orgJob },
    { name:'매니저 역할역량 평균', color: CHART_COLORS[2], values: mgrRoleTrend },
    { name:'선임매니저 역할역량 평균', color: CHART_COLORS[3], values: seniorRoleTrend },
    { name:'센터장 역할역량 평균', color: CHART_COLORS[4], values: centerRoleTrend },
  ], labels, { showLabels: true, height: 300 });

  const managerRows = all.filter(r => r.role === '매니저');

  const teams = [...new Set(managerRows.map(r => r.team).filter(t=>t))];

      ${orgTrend}
    </div>

    <div class="card">
      <h2>매니저 vs 소속팀 평균 비교</h2>
      <div class="fieldGrid" style="margin-bottom:16px;">
        <div>
          <div class="scaleLabel">매니저 선택</div>
          <select id="mgrSelect">${managers.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')}</select>
        </div>
        <div>
          <div class="scaleLabel">회차 선택</div>
          <select id="roundSelect2">${rounds.map(rk=>`<option value="${rk}" ${rk===latestRoundKey?'selected':''}>${rk.replace('-',' - ')}회차</option>`).join('')}</select>
        </div>
      </div>
      <h3 style="margin-top:6px;">공통역량</h3>
      <div id="radarHolderCommon"></div>
      <h3>직무역량</h3>
      <div id="radarHolderJob"></div>
      <h3>역할역량 · 매니저</h3>
      <div id="radarHolderRole"></div>
    </div>

    <div class="card">
      <h2>팀별 평균 비교</h2>
      <p class="muted" style="margin-bottom:12px;">매니저 응답 기준으로, 역량별 모든 하위역량의 현재수준 평균을 팀별 막대(팀마다 같은 색)로 비교합니다. 막대 위 숫자는 평균값입니다.</p>
      <div class="fieldGrid" style="margin-bottom:16px; max-width:260px;">
        <div>
          <div class="scaleLabel">회차 선택</div>
          <select id="roundSelect3">${rounds.map(rk=>`<option value="${rk}" ${rk===latestRoundKey?'selected':''}>${rk.replace('-',' - ')}회차</option>`).join('')}</select>

      <div id="teamBarHolder"></div>

      borichScores([...COMMON, ...JOB].map(g=>g.key), all.filter(r => (r.year+'-'+r.round) === latestRoundKey)))}

    <div class="footer"><button class="btn secondary" id="backBtn">돌아가기</button></div>

    MANAGER_TIER_KEYS.forEach(k => {
      const vals = teamRows.map(r => r.groupScores && r.groupScores[k] && r.groupScores[k].level).filter(v=>v!=null);
      teamAvgByKey[k] = avg(vals);
    });
    const layerCharts = [
      { holder: 'radarHolderCommon', keys: COMMON.map(g=>g.key) },
      { holder: 'radarHolderJob', keys: JOB.map(g=>g.key) },
      { holder: 'radarHolderRole', keys: ROLE['매니저'].map(g=>g.key) },
    ];
    layerCharts.forEach(({ holder, keys }) => {
      const labels = keys.map(k => GROUP_TITLE[k]);
      const mgrValues = keys.map(k => mgrRow && mgrRow.groupScores && mgrRow.groupScores[k] ? mgrRow.groupScores[k].level : null);
      const teamValues = keys.map(k => teamAvgByKey[k]);
      const radar = radarChartSVG(labels, [
        { name: mgr + ' (개인)', color: CHART_COLORS[1], values: mgrValues },
        { name: (myTeam||'소속팀 미지정') + ' 팀 평균', color: CHART_COLORS[0], values: teamValues },

      const charts = block.groups.map(g => {
        const data = g.items.map((_, i) => rowsByTeam.map(rows => avg(rows.map(r => {
          const a = r.answers && r.answers[g.key + '-' + i];
          return a ? a.level : null;
        }))));
        const chart = groupedBarSVG(subLabels(g), teamNames, teamColors, data, { height: 230, barWidth: 30, groupGap: 28, bottomPad: 46, hideLegend: true });
        return '<div style="margin-bottom:18px;"><div style="font-weight:700; font-size:14px; margin-bottom:4px;">' + escapeHtml(g.title) + '</div>' + chart + '</div>';
      }).join('');
      return '<h3 style="margin-top:20px; padding-bottom:6px; border-bottom:2px solid var(--border);">' + block.title + '</h3>' + charts;
    }).join('');
    document.getElementById('teamBarHolder').innerHTML = legend + html;
  }
  document.getElementById('roundSelect3').onchange = drawTeamBar;
  drawTeamBar();

  document.getElementById('backBtn').onclick = () => { state.screen = 'start'; render(); };
}

      <input type="text" id="pinInput" placeholder="센터장 암호" />
      <div style="height:14px;"></div>
      <div class="row"><button class="btn" id="unlockBtn">확인</button><button class="btn secondary" id="backBtn">돌아가기</button></div>
      <p class="muted" id="pinError" style="color:var(--red); margin-top:10px;"></p>
    </div>
  `;
  document.getElementById('backBtn').onclick = () => { state.screen = 'start'; render(); };
  document.getElementById('unlockBtn').onclick = async () => {
    const v = document.getElementById('pinInput').value;
    const correct = await loadAdminPasscode();
    if (v === correct) { state.adminUnlocked = true; render(); }
    else { document.getElementById('pinError').textContent = '암호가 올바르지 않습니다.'; }
  };
}

async function renderAdmin() {
  if (state.role !== '센터장') {
    app.innerHTML = `
      <div class="brand">서울청년센터 광진</div>
      <h1>접근 권한이 없습니다</h1>
      <div class="card"><p>관리자 대시보드는 센터장만 접근할 수 있습니다. 시작화면에서 직급을 \'센터장\'으로 선택한 뒤 다시 시도해주세요.</p></div>
      <div class="footer"><button class="btn secondary" id="backBtn0">돌아가기</button></div>
    `;
    document.getElementById('backBtn0').onclick = () => { state.screen = 'start'; render(); };
    return;
  }
  if (!state.adminUnlocked) { await renderAdminGate('관리자 보기', '원자료를 종합해서 보려면 센터장 암호를 입력하세요.'); return; }

  app.innerHTML = `<div class="brand">서울청년센터 광진</div><h1>관리자 대시보드</h1><p class="muted">불러오는 중...</p>`;
  const rows = await fetchAllResponses(true);

  if (rows.length === 0) {
    app.innerHTML = `
      <div class="brand">서울청년센터 광진</div><h1>관리자 대시보드</h1>
      <div class="card"><p>아직 제출된 응답이 없습니다.</p></div>
      <div class="footer"><button class="btn secondary" id="backBtn2">돌아가기</button></div>
    `;
    document.getElementById('backBtn2').onclick = () => { state.screen = 'start'; render(); };
    return;
  }

  const overallCommon = avg(rows.map(r => r.commonAvg && r.commonAvg.level));
  const overallJob = avg(rows.map(r => r.jobAvg && r.jobAvg.level));
  const groupKeys = {};
  rows.forEach(r => { Object.keys(r.groupScores||{}).forEach(k => groupKeys[k] = true); });
  const groupAvgRows = Object.keys(groupKeys).sort().map(k => {
    const vals = rows.map(r => r.groupScores && r.groupScores[k] && r.groupScores[k].level).filter(v=>v!=null);
    return { key:k, title: GROUP_TITLE[k] || k, avg: vals.length ? avg(vals) : null, n: vals.length };
  }).filter(g => g.avg != null).sort((a,b)=>a.avg-b.avg);

  const adminRounds = [...new Set(rows.map(r => r.year + '-' + r.round))].sort();
  const adminLatestRoundKey = adminRounds[adminRounds.length - 1];
  const adminLatestRows = rows.filter(r => (r.year + '-' + r.round) === adminLatestRoundKey);
  const adminBorichKeys = Object.keys(groupKeys).sort();

  const adminManagerRows = rows.filter(r => r.role === '매니저');
  const teamPasscodes = await loadTeamPasscodes();
  const adminTeams = [...new Set([...TEAM_NAMES, ...adminManagerRows.map(r => r.team).filter(t=>t), ...Object.keys(teamPasscodes), ...state.adminExtraTeams])];

  app.innerHTML = `
    <div class="brand">서울청년센터 광진</div>
    <h1>관리자 대시보드</h1>
    <p class="muted">총 응답 ${rows.length}건 ${!state.dbReady ? '(이 기기의 로컬 저장 데이터 기준)' : '(전 직원 공유 데이터 기준, 실시간)'}</p>

    <div class="card">
      <div class="row" style="justify-content:space-around; text-align:center;">
        <div><div class="bigNum">${rows.length}</div><div class="muted">응답 건수</div></div>
        <div><div class="bigNum">${fmt(overallCommon)}</div><div class="muted">공통역량 평균</div></div>
        <div><div class="bigNum">${fmt(overallJob)}</div><div class="muted">직무역량 평균</div></div>
      </div>
    </div>

    <div class="card">
      <h2>데이터 백업</h2>
      <p class="muted">이 앱은 별도 서버 없이 저장되기 때문에, 정기적으로 내려받아 보관해두시길 권합니다.</p>
      <div class="row">
        <button class="btn small secondary" id="exportJsonBtn">전체 원본 백업 (JSON)</button>
        <button class="btn small secondary" id="exportCsvBtn">요약 CSV 다운로드</button>
      </div>
      <p class="muted" id="exportMsg" style="margin-top:10px;"></p>
    </div>

    <div class="card">
      <h2>팀 접근 암호 관리</h2>
      <p class="muted">선임매니저가 ‘우리 팀 성장 보기’에 들어갈 때 필요한 암호입니다. 새 값을 입력하고 저장하면 즉시 바뀝니다(빈 칸으로는 저장되지 않습니다).</p>
      ${adminTeams.length ? adminTeams.map(tn => `
        <div class="row" style="align-items:center; margin-bottom:10px;">
          <div style="min-width:110px; font-weight:700;">${escapeHtml(tn)}</div>
          <input type="text" class="teamPassInput" data-team="${escapeHtml(tn)}" placeholder="${teamPasscodes[tn] ? '설정됨 · 변경하려면 새 암호 입력' : '암호 미설정'}" style="flex:1; min-width:160px;" />
          <button class="btn small secondary teamPassSaveBtn" data-team="${escapeHtml(tn)}">저장</button>
        </div>
      `).join('') : '<p class="muted">아직 등록된 팀이 없습니다.</p>'}
      <div class="row" style="align-items:center; margin-top:10px;">
        <input type="text" id="newTeamNameInput" placeholder="새 팀(선임매니저 이름) 추가" style="flex:1; min-width:160px;" />
        <button class="btn small secondary" id="addTeamBtn">팀 추가</button>
      </div>
      <p class="muted" id="teamPassMsg" style="margin-top:10px;"></p>
    </div>

    <div class="card">
      <h2>센터장 암호 변경</h2>
      <p class="muted">‘전체 현황 보기’·‘관리자 대시보드’에 들어올 때 쓰는 암호입니다. 아래에 새 암호를 입력하고 저장하면 다음 접속부터 바로 적용됩니다.</p>
      <div class="fieldGrid">
        <input type="text" id="newAdminPw1" placeholder="새 센터장 암호" />
        <input type="text" id="newAdminPw2" placeholder="새 암호 확인" />
      </div>
      <div style="height:12px;"></div>
      <button class="btn small secondary" id="changeAdminPwBtn">암호 변경</button>
      <p class="muted" id="adminPwMsg" style="margin-top:10px;"></p>
    </div>

    <div class="card">
      <h2>역량별 전체 평균 (낮은 순)</h2>
      ${groupAvgRows.map(g => `
        <div class="factorBar">
          <div class="factorBarTop"><span class="factorBarName">${escapeHtml(g.title)}</span><span>${fmt(g.avg)} <span class="muted">(n=${g.n})</span></span></div>
          <div class="factorTrack"><div class="factorFill" style="width:${(g.avg/5*100).toFixed(0)}%; background:${barColor(g.avg)};"></div></div>
        </div>
      `).join('')}
    </div>

    ${borichCardHTML('locusAdmin', 'Borich 요구도 분석 (전체 응답 · ' + adminLatestRoundKey.replace('-',' - ') + '회차)',
      borichScores(adminBorichKeys, adminLatestRows))}
    <p class="muted" style="margin-top:-8px;">※ 매니저·선임매니저·센터장의 역할역량 문항은 서로 달라 같은 표에 함께 순위가 매겨집니다 — 직급을 넘나드는 비교보다는 팀 화면·전체 현황 화면의 역할별 분석을 우선 참고하세요.</p>

    <div class="card">
      <h2>전체 응답 목록</h2>
      <table>
        <thead><tr><th>이름</th><th>직급</th><th>팀</th><th>연도</th><th>회차</th><th>공통</th><th>직무</th><th>역할</th></tr></thead>
        <tbody>
          ${rows.slice().sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt)).map(r => `
            <tr>
              <td>${escapeHtml(r.name||'')}</td><td>${escapeHtml(r.role||'')}</td><td>${escapeHtml(r.team||'-')}</td>
              <td>${r.year||''}</td><td>${r.round||''}</td>
              <td>${fmt(r.commonAvg&&r.commonAvg.level)}</td><td>${fmt(r.jobAvg&&r.jobAvg.level)}</td><td>${fmt(r.roleAvg&&r.roleAvg.level)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <div class="footer"><button class="btn secondary" id="backBtn3">돌아가기</button></div>
  `;
  app.querySelectorAll('.teamPassSaveBtn').forEach(btn => btn.onclick = async () => {
    const team = btn.dataset.team;
    const input = app.querySelector('.teamPassInput[data-team="' + CSS.escape(team) + '"]');
    const val = (input.value || '').trim();
    const msg = document.getElementById('teamPassMsg');
    if (!val) { msg.textContent = '암호를 입력해주세요.'; msg.style.color = 'var(--red)'; return; }
    if (val.length < 4) { msg.textContent = '암호는 4자 이상으로 설정해주세요.'; msg.style.color = 'var(--red)'; return; }
    const current = await loadTeamPasscodes();
    current[team] = val;
    await saveTeamPasscodes(current);
    msg.style.color = 'var(--green)';
    msg.textContent = '\'' + team + '\' 팀 암호를 변경했습니다.';
    input.value = '';
  });
  document.getElementById('addTeamBtn').onclick = () => {
    const v = (document.getElementById('newTeamNameInput').value || '').trim();
    if (!v) return;
    if (!state.adminExtraTeams.includes(v)) state.adminExtraTeams.push(v);
    render();
  };
  document.getElementById('changeAdminPwBtn').onclick = async () => {
    const v1 = document.getElementById('newAdminPw1').value;
    const v2 = document.getElementById('newAdminPw2').value;
    const msg = document.getElementById('adminPwMsg');
    if (!v1 || v1.length < 4) { msg.style.color = 'var(--red)'; msg.textContent = '암호는 4자 이상으로 설정해주세요.'; return; }
    if (v1 !== v2) { msg.style.color = 'var(--red)'; msg.textContent = '두 암호가 서로 다릅니다.'; return; }
    await saveAdminPasscode(v1);
    msg.style.color = 'var(--green)';
    msg.textContent = '센터장 암호를 변경했습니다. 다음 접속부터 새 암호를 사용하세요.';
    document.getElementById('newAdminPw1').value = '';
    document.getElementById('newAdminPw2').value = '';
  };
  document.getElementById('backBtn3').onclick = () => { state.screen = 'start'; render(); };

  document.getElementById('exportJsonBtn').onclick = async () => {
    const msg = document.getElementById('exportMsg');
    const downloads = await getDownloads();
    if (!downloads) { msg.style.color = 'var(--red)'; msg.textContent = '이 화면에서는 파일 저장 기능을 쓸 수 없습니다.'; return; }
    const stamp = new Date().toISOString().slice(0,10);
    try {
      await downloads.save({ filename: `역량진단_백업_${stamp}.json`, data: JSON.stringify(rows, null, 2) });
      msg.style.color = 'var(--green)'; msg.textContent = '백업 파일을 저장했습니다.';
    } catch (e) {
      if (e && e.code === 'declined') { msg.textContent = ''; return; }
      msg.style.color = 'var(--red)'; msg.textContent = '저장에 실패했습니다 (' + (e && e.code || '알 수 없는 오류') + ').';
    }
  };
  document.getElementById('exportCsvBtn').onclick = async () => {
    const msg = document.getElementById('exportMsg');
    const downloads = await getDownloads();
    if (!downloads) { msg.style.color = 'var(--red)'; msg.textContent = '이 화면에서는 파일 저장 기능을 쓸 수 없습니다.'; return; }
    const header = ['이름','직급','팀','연도','회차','제출일','공통역량','직무역량','역할역량'];
    const csvRows = [header.join(',')];
    rows.slice().sort((a,b)=> new Date(a.submittedAt)-new Date(b.submittedAt)).forEach(r => {
      const line = [r.name, r.role, r.team||'', r.year, r.round,
        r.submittedAt ? new Date(r.submittedAt).toLocaleString('ko-KR') : '',
        fmt(r.commonAvg&&r.commonAvg.level), fmt(r.jobAvg&&r.jobAvg.level), fmt(r.roleAvg&&r.roleAvg.level)]
        .map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
      csvRows.push(line);
    });
    const csv = '\uFEFF' + csvRows.join('\r\n');
    const stamp = new Date().toISOString().slice(0,10);
    try {
      await downloads.save({ filename: `역량진단_요약_${stamp}.csv`, data: csv });
      msg.style.color = 'var(--green)'; msg.textContent = 'CSV 파일을 저장했습니다.';
    } catch (e) {
      if (e && e.code === 'declined') { msg.textContent = ''; return; }
      msg.style.color = 'var(--red)'; msg.textContent = '저장에 실패했습니다 (' + (e && e.code || '알 수 없는 오류') + ').';
    }
  };
}

// ================= 시작 =================
initDb().finally(() => render());
render();
</script>
</body>
</html>
